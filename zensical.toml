[project]
site_name = "LiteLLM Admin Panel"
site_description = "Документация по админ-панели LiteLLM"
site_url = "https://vadzimik977.github.io/litellm-admin-docs/"
repo_url = "https://github.com/Vadzimik977/litellm-admin-docs"
repo_name = "Vadzimik977/litellm-admin-docs"

nav = [
  { "Home" = "index.md" },
  { "Документация" = [
    { "Интеграция с БД LiteLLM" = "litellm-integration/litellm_db.md" },
    { "Ценообразование моделей" = "litellm-integration/pricing.md" },
    { "LiteLLM Auth" = "litellm-integration/litellm_auth.md" },
    { "LiteLLM Admin Panel" = [
      { "Overview" = "litellm-integration/litellm_admin.md" },
      { "Users" = "litellm-integration/admin-users.md" },
      { "Teams" = "litellm-integration/admin-teams.md" },
      { "Organizations" = "litellm-integration/admin-organizations.md" },
      { "API Keys" = "litellm-integration/admin-keys.md" },
      { "Models" = "litellm-integration/admin-models.md" },
      { "Budgets" = "litellm-integration/admin-budgets.md" },
      { "Logs" = "litellm-integration/admin-logs.md" },
      { "Settings" = "litellm-integration/admin-settings.md" },
      { "Usage" = [
        { "Overview" = "litellm-integration/admin-usage.md" },
        { "Global Usage" = "litellm-integration/admin-usage-global.md" },
        { "Your Usage" = "litellm-integration/admin-usage-your.md" },
        { "Organization Usage" = "litellm-integration/admin-usage-organization.md" },
        { "Team Usage" = "litellm-integration/admin-usage-team.md" },
        { "Customer Usage" = "litellm-integration/admin-usage-customer.md" },
        { "Tag Usage" = "litellm-integration/admin-usage-tag.md" },
        { "Agent Usage" = "litellm-integration/admin-usage-agent.md" },
        { "User Usage" = "litellm-integration/admin-usage-user.md" },
        { "User Agent Activity" = "litellm-integration/admin-usage-user-agent.md" },
      ]},
      { "Activity" = [
        { "Model Activity" = "litellm-integration/admin-model-activity.md" },
        { "Key Activity" = "litellm-integration/admin-key-activity.md" },
        { "MCP Server Activity" = "litellm-integration/admin-mcp-activity.md" },
        { "Team Activity" = "litellm-integration/admin-team-activity.md" },
        { "User Activity" = "litellm-integration/admin-user-activity.md" },
      ]},
    ]},
  ]},
]

[project.theme]
palette = [
  { scheme = "default", primary = "indigo", accent = "indigo", toggle = { icon = "material/brightness-7", name = "Switch to dark mode" } },
  { scheme = "slate", primary = "indigo", accent = "indigo", toggle = { icon = "material/brightness-4", name = "Switch to light mode" } },
]
features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "content.code.copy",
  "search.highlight",
]
logo = "logo.svg"

# Markdown extensions
[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]